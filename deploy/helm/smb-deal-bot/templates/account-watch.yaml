{{- define "smb-deal-bot.accountWatchEnv" }}
# Optional keys: without them reminders stay in the app and the digest is printed in the job log.
- name: LINEAR_API_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecret }}
      key: LINEAR_API_KEY
      optional: true
# The chart value wins when set; otherwise LINEAR_TEAM_KEY from the Secret (.env). Blank means first team.
- name: LINEAR_TEAM_KEY
{{- if .Values.accountWatch.linearTeamKey }}
  value: {{ .Values.accountWatch.linearTeamKey | quote }}
{{- else }}
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecret }}
      key: LINEAR_TEAM_KEY
      optional: true
{{- end }}
- name: SLACK_WEBHOOK_URL
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecret }}
      key: SLACK_WEBHOOK_URL
      optional: true
# Accounts live in the chart's Postgres (tables prefixed aw_), shared by the app and both CronJobs.
- name: POSTGRES_HOST
  value: postgres
- name: POSTGRES_DB
  value: {{ .Values.postgres.database | quote }}
- name: POSTGRES_USER
  value: {{ .Values.postgres.user | quote }}
- name: POSTGRES_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecret }}
      key: POSTGRES_PASSWORD
{{- end }}
{{- define "smb-deal-bot.accountWatchJob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}
  labels:
    {{- include "smb-deal-bot.labels" .root | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "smb-deal-bot.labels" .root | nindent 12 }}
            app.kubernetes.io/name: {{ .name }}
        spec:
          restartPolicy: Never
          containers:
            - name: {{ .command }}
              image: "{{ .root.Values.accountWatch.image.repository }}:{{ .root.Values.accountWatch.image.tag }}"
              imagePullPolicy: {{ .root.Values.accountWatch.image.pullPolicy }}
              command: ["python", "-m", "account_watch.cli", {{ .command | quote }}]
              env:
                {{- include "smb-deal-bot.accountWatchEnv" .root | nindent 16 }}
              resources:
                {{- toYaml .root.Values.accountWatch.resources | nindent 16 }}
{{- end }}
{{- if .Values.accountWatch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-watch
  labels:
    {{- include "smb-deal-bot.labels" . | nindent 4 }}
    app.kubernetes.io/name: account-watch
spec:
  replicas: {{ .Values.accountWatch.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: account-watch
  template:
    metadata:
      labels:
        {{- include "smb-deal-bot.labels" . | nindent 8 }}
        app.kubernetes.io/name: account-watch
    spec:
      containers:
        - name: account-watch
          image: "{{ .Values.accountWatch.image.repository }}:{{ .Values.accountWatch.image.tag }}"
          imagePullPolicy: {{ .Values.accountWatch.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8501
          env:
            {{- include "smb-deal-bot.accountWatchEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.accountWatch.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: account-watch
  labels:
    {{- include "smb-deal-bot.labels" . | nindent 4 }}
    app.kubernetes.io/name: account-watch
spec:
  selector:
    app.kubernetes.io/name: account-watch
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Every morning: flag overdue onboarding steps and renewals that reached 90, 60 or 30 days.
{{- include "smb-deal-bot.accountWatchJob" (dict "root" . "name" "account-watch-daily" "command" "run-daily" "schedule" .Values.accountWatch.dailySchedule) }}
---
# Once a week: post the digest to Slack (or print it to the job log without a webhook).
{{- include "smb-deal-bot.accountWatchJob" (dict "root" . "name" "account-watch-digest" "command" "digest" "schedule" .Values.accountWatch.digestSchedule) }}
{{- end }}
