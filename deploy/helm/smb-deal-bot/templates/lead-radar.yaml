{{- if .Values.leadRadar.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-radar
  labels:
    {{- include "smb-deal-bot.labels" . | nindent 4 }}
    app.kubernetes.io/name: lead-radar
spec:
  replicas: {{ .Values.leadRadar.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lead-radar
  template:
    metadata:
      labels:
        {{- include "smb-deal-bot.labels" . | nindent 8 }}
        app.kubernetes.io/name: lead-radar
    spec:
      containers:
        - name: lead-radar
          image: "{{ .Values.leadRadar.image.repository }}:{{ .Values.leadRadar.image.tag }}"
          imagePullPolicy: {{ .Values.leadRadar.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.leadRadar.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: lead-radar
  labels:
    {{- include "smb-deal-bot.labels" . | nindent 4 }}
    app.kubernetes.io/name: lead-radar
spec:
  selector:
    app.kubernetes.io/name: lead-radar
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
