{{- define "smb-deal-bot.quoteDeskEnv" }}
# Optional keys: without them the app runs in demo mode (simple notes parser, follow-ups kept locally).
- name: ANTHROPIC_API_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecret }}
      key: ANTHROPIC_API_KEY
      optional: true
- name: LINEAR_API_KEY
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecret }}
      key: LINEAR_API_KEY
      optional: true
# The chart value wins when set; otherwise LINEAR_TEAM_KEY from the Secret (.env). Blank means first team.
- name: LINEAR_TEAM_KEY
{{- if .Values.quoteDesk.linearTeamKey }}
  value: {{ .Values.quoteDesk.linearTeamKey | quote }}
{{- else }}
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecret }}
      key: LINEAR_TEAM_KEY
      optional: true
{{- end }}
# Quotes and follow-ups live in the chart's Postgres, so the app and the CronJob share them.
- name: POSTGRES_HOST
  value: postgres
- name: POSTGRES_DB
  value: {{ .Values.postgres.database | quote }}
- name: POSTGRES_USER
  value: {{ .Values.postgres.user | quote }}
- name: POSTGRES_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ .Values.existingSecret }}
      key: POSTGRES_PASSWORD
{{- end }}
{{- if .Values.quoteDesk.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-desk
  labels:
    {{- include "smb-deal-bot.labels" . | nindent 4 }}
    app.kubernetes.io/name: quote-desk
spec:
  replicas: {{ .Values.quoteDesk.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: quote-desk
  template:
    metadata:
      labels:
        {{- include "smb-deal-bot.labels" . | nindent 8 }}
        app.kubernetes.io/name: quote-desk
    spec:
      containers:
        - name: quote-desk
          image: "{{ .Values.quoteDesk.image.repository }}:{{ .Values.quoteDesk.image.tag }}"
          imagePullPolicy: {{ .Values.quoteDesk.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8501
          env:
            {{- include "smb-deal-bot.quoteDeskEnv" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.quoteDesk.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: quote-desk
  labels:
    {{- include "smb-deal-bot.labels" . | nindent 4 }}
    app.kubernetes.io/name: quote-desk
spec:
  selector:
    app.kubernetes.io/name: quote-desk
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Every morning, turn follow-ups that have come due into Linear tasks.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quote-desk-followups
  labels:
    {{- include "smb-deal-bot.labels" . | nindent 4 }}
    app.kubernetes.io/name: quote-desk-followups
spec:
  schedule: {{ .Values.quoteDesk.followupSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "smb-deal-bot.labels" . | nindent 12 }}
            app.kubernetes.io/name: quote-desk-followups
        spec:
          restartPolicy: Never
          containers:
            - name: run-followups
              image: "{{ .Values.quoteDesk.image.repository }}:{{ .Values.quoteDesk.image.tag }}"
              imagePullPolicy: {{ .Values.quoteDesk.image.pullPolicy }}
              command: ["python", "-m", "quote_desk.cli", "run-followups"]
              env:
                {{- include "smb-deal-bot.quoteDeskEnv" . | nindent 16 }}
              resources:
                {{- toYaml .Values.quoteDesk.resources | nindent 16 }}
{{- end }}
