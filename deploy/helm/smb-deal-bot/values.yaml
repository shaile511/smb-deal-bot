# Name of the Secret holding POSTGRES_PASSWORD, ANTHROPIC_API_KEY, LINEAR_API_KEY, SLACK_WEBHOOK_URL.
# Create it from .env (see README) so no key ever lives in this file.
existingSecret: smb-deal-bot-secrets

postgres:
  image: postgres:16-alpine
  database: dealbot
  user: dealbot
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Services are switched on as they are built.
leadRadar:
  enabled: false
  replicas: 1
  # Linear team key or name for new issues; empty means the workspace's first team.
  linearTeamKey: ""
  image:
    # Built locally and loaded into kind (see services/lead-radar/README.md).
    repository: smb-deal-bot/lead-radar
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
quoteDesk:
  enabled: false
  replicas: 1
  linearTeamKey: ""
  # When the follow-up CronJob runs, in UTC. 13:00 UTC is 8 AM Eastern (9 AM in summer).
  followupSchedule: "0 13 * * *"
  image:
    # Built locally and loaded into kind (see services/quote-desk/README.md).
    repository: smb-deal-bot/quote-desk
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
accountWatch:
  enabled: false
